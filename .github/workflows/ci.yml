name: CI

on: [push, pull_request, workflow_dispatch]

permissions: {}

jobs:
  python:
    name: ruff + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check formatting and lints
        run: |
          uvx ruff format --check --diff py/
          uvx ruff check --diff py/
      # `TY_UV=scripts` is what hands ty the script's own PEP 723 environment; without it the IPython imports are unresolved and the run is meaningless rather than failing.
      - name: Check typing
        run: TY_UV=scripts uvx ty check py/kernel.py
      - name: Check streaming worker lifecycle
        run: uv run --script test/streaming-kernel.py

  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu, macos]
      fail-fast: false
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
      # The suite spawns the real kernel, which builds its own PEP 723 environment — no separate Python setup, but uv has to be there.
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun run test

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.52.2

  web:
    name: web (official dsh 0.2.2-rc.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - run: bun run test:web "${{ runner.temp }}/codeact-web"
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: web-failure
          path: |
            ${{ runner.temp }}/codeact-web/*/host.log
            ${{ runner.temp }}/codeact-web/*/browser.txt
            ${{ runner.temp }}/codeact-web/*/failure.png
            ${{ runner.temp }}/codeact-web/*/settled.json

  legacy:
    name: smoke (dsh 0.2.1-rc.2, ${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu, macos]
      fail-fast: false
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install exact legacy host packages
        run: |
          bun -e 'const p = await Bun.file("package.json").json(); delete p.devDependencies["@deepseek-ai/dsh-tool-executor-ptc"]; for (const name of Object.keys(p.devDependencies)) if (name.startsWith("@deepseek-ai/dsh-")) p.devDependencies[name] = "0.2.1-rc.2"; p.devDependencies["@deepseek-ai/cordis"] = "4.0.5"; p.devDependencies["@deepseek-ai/schemastery"] = "3.18.5"; await Bun.write("package.json", JSON.stringify(p, null, 2) + "\n")'
          rm bun.lock
          bun install
      - run: bun run test

  streaming:
    name: streaming (dsh 0.2.2-rc.1, ${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu, macos]
      fail-fast: false
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun run test:streaming
