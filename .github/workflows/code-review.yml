name: code-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  id-token: write

jobs:
  eligibility:
    # Same-repository PRs, plus pushes to main so merged work is reviewed too; the App's own PRs wait until they leave draft.
    if: >
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request != null && github.event.issue.state == 'open' && github.event.sender.type != 'Bot')
      || (github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action != 'ready_for_review' || github.event.pull_request.user.type == 'Bot')
          && (github.event_name == 'pull_request_target' || github.event.sender.type != 'Bot'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - uses: actions/github-script@v9
        id: permission
        with:
          script: |
            if (['push', 'pull_request_target', 'workflow_dispatch'].includes(context.eventName)) {
              core.setOutput('allowed', true)
              return
            }
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: context.payload.sender.login })
            core.setOutput('allowed', ['admin', 'maintain', 'write'].includes(data.permission))

  review:
    needs: eligibility
    if: needs.eligibility.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    # Authorize before joining the queue, then serialize all runs that can share this PR's cached review session.
    concurrency:
      group: code-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
    steps:
      - uses: promplate/code-review@main
        with:
          codex-config: ${{ secrets.CODEX_CONFIG }}
          codex-auth: ${{ secrets.CODEX_AUTH }}
