# The package-root row serves the browser bundle; preset rows and package subpaths do not.
# `uiOnly` avoids registering Python and its exclusive guard globally. Execution stays in the CodeAct preset.
- insert:
    - id: py-codeact-ui
      name: dsh-py-codeact
      config:
        uiOnly: true
    # A separate profile entry owns the live preference without remounting execution or its kernels.
    - id: py-codeact-settings
      name: dsh-py-codeact/settings
