# Plugin row for a coding composition with a persistent Python REPL as its action space.
#
# On DSH 0.2.2, add this row to an owned `@deepseek-ai/dsh-agent-preset` declaration's `config.plugins` through a profile bundle patch. Preserve the inspected composition's realms and consumers. The registry does not scan preset directories.
# Headless is preset-free: insert this row into its profile overlay and disable `tool-executor-native`, since each scope allows one executor.
#
# Keep the host's tools in native mode. Its own PTC executor would also reserve `run_code` and add a competing SDK prompt; this plugin owns the Python executor.
#
# This row publishes no service; kernels belong to the plugin fiber and are keyed by session. Do not isolate the host tools, prompt, session, projection, or LLM services it consumes.

- id: py-codeact
  name: dsh-py-codeact
  config:
    # Omit both `command` and `python` to spawn `uv run --script py/kernel.py`, which provisions IPython and partial-python from the script's PEP 723 header. First use pays a resolve; warm afterwards.
    #
    # `python` names an interpreter that ALREADY has ipython + objprint + partial-python — a prepared project venv, so the model can import the project's own packages:
    #   python: /path/to/.venv/bin/python
    #
    # `command` is the full argv escape hatch:
    #   command: ['uv', 'run', '--with', 'pandas', '--script', '...']

    # Model-facing tool name. Keep it distinct from `run_code` — and from an MCP IPython server's, if one is mounted (see the README).
    toolName: python

    # 'code' (default): `python` is the ONLY directly callable tool; everything else is reachable solely as `from __dsh__.tools import ...` inside a cell.
    # 'both' keeps the native schemas too — for debugging a composition.
    mode: code

    # Omit streaming to follow Plugins > dsh-py-codeact > Streaming execution (off by default).
    # An explicit true or false overrides that switch for this preset. Streaming requires DSH 0.2.2, mode: code, and session persistence; use print for output.
    # streaming: true

    # false (default) spawns with an allowlisted environment — PATH, HOME, TMPDIR, LANG, LC_ALL, TERM — so no ambient credentials reach model code. (Not an EMPTY env like the worker-thread runtime: CPython running IPython needs a profile dir and a PATH for shell escapes.) Set true to pass the whole harness environment through.
    inheritEnv: false

# Python has shell-equivalent capabilities. Keep the host sandbox and approval providers: they confine the interpreter and gate every bridged tool call through the normal execution pipeline.
